<?
	const alexa=service_require("web/alexa/alexa-remote");
	if(input.name&&input.text){
		const name=unescape(input.name).toLowerCase().split("+").join(" ");
		let text=unescape(input.text).toLowerCase().split("+").join(" ");

		if(text.endsWith("?")) text+=" fragt, "+name;
		else if(text.endsWith("!")) text+=" schreit, "+name;
		else text+=" sagt, "+name;
		
		log("SPRICHT: "+text);
		alexa.speak(text)
	};
